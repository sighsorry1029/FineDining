<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title description">
  <title id="title">Chef's Choice multiplier distribution</title>
  <desc id="description">With a minimum multiplier of 1.10, maximum of 1.50, and most likely multiplier at maximum Cooking level of 1.30, the triangular distribution peak moves linearly from 1.10 at Cooking 0 to 1.20 at Cooking 50 and 1.30 at Cooking 100.</desc>
  <rect width="1400" height="820" fill="#f8fafc"/>

  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 18px; fill: #536078; }
    .panel-title { font-size: 23px; font-weight: 700; }
    .label { font-size: 17px; fill: #536078; }
    .tick { font-size: 16px; fill: #536078; }
    .legend { font-size: 17px; font-weight: 600; }
    .note { font-size: 17px; fill: #37435a; }
    .value { font-size: 17px; font-weight: 700; }
  </style>

  <text x="64" y="60" class="title">How Cooking moves the Chef multiplier peak</text>
  <text x="64" y="91" class="subtitle">Example: Minimum x1.10 · Maximum x1.50 · Most Likely at max Cooking x1.30</text>

  <rect x="48" y="122" width="848" height="642" rx="20" fill="#ffffff" stroke="#dbe2ec" stroke-width="2"/>
  <rect x="920" y="122" width="432" height="642" rx="20" fill="#ffffff" stroke="#dbe2ec" stroke-width="2"/>

  <text x="82" y="168" class="panel-title">Triangular probability density</text>

  <line x1="410" y1="162" x2="446" y2="162" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="456" y="168" class="legend" fill="#2563eb">Cooking 0</text>
  <line x1="568" y1="162" x2="604" y2="162" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <text x="614" y="168" class="legend" fill="#b96d00">Cooking 50</text>
  <line x1="750" y1="162" x2="786" y2="162" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <text x="796" y="168" class="legend" fill="#12813c">Cooking 100</text>

  <!-- Left plot grid -->
  <line x1="126" y1="226" x2="126" y2="650" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="303" y1="226" x2="303" y2="650" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="480" y1="226" x2="480" y2="650" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="657" y1="226" x2="657" y2="650" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="834" y1="226" x2="834" y2="650" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="126" y1="230" x2="834" y2="230" stroke="#e8edf4" stroke-width="1.5"/>
  <line x1="126" y1="440" x2="834" y2="440" stroke="#eef2f7" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="126" y1="214" x2="126" y2="650" stroke="#748198" stroke-width="2"/>
  <line x1="126" y1="650" x2="852" y2="650" stroke="#748198" stroke-width="2"/>
  <path d="M852 650 L840 643 L840 657 Z" fill="#748198"/>
  <text x="99" y="236" class="tick" text-anchor="end">5.0</text>
  <text x="99" y="656" class="tick" text-anchor="end">0.0</text>
  <text x="80" y="448" class="label" transform="rotate(-90 80 448)" text-anchor="middle">Probability density</text>

  <!-- Distributions: equal height, fixed support -->
  <path d="M126 650 L126 230 L834 650" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
  <path d="M126 650 L303 230 L834 650" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linejoin="round"/>
  <path d="M126 650 L480 230 L834 650" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round"/>

  <!-- X ticks -->
  <g class="tick" text-anchor="middle">
    <line x1="126" y1="650" x2="126" y2="660" stroke="#748198" stroke-width="2"/>
    <text x="126" y="684">1.10</text>
    <line x1="303" y1="650" x2="303" y2="660" stroke="#748198" stroke-width="2"/>
    <text x="303" y="684">1.20</text>
    <line x1="480" y1="650" x2="480" y2="660" stroke="#748198" stroke-width="2"/>
    <text x="480" y="684">1.30</text>
    <line x1="657" y1="650" x2="657" y2="660" stroke="#748198" stroke-width="2"/>
    <text x="657" y="684">1.40</text>
    <line x1="834" y1="650" x2="834" y2="660" stroke="#748198" stroke-width="2"/>
    <text x="834" y="684">1.50</text>
  </g>

  <line x1="480" y1="230" x2="480" y2="650" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 7" opacity="0.75"/>
  <circle cx="480" cy="230" r="7" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
  <rect x="496" y="242" width="242" height="54" rx="10" fill="#ecfdf3" stroke="#b7edcb"/>
  <text x="512" y="264" class="label" fill="#12813c">Cooking 100 peak</text>
  <text x="512" y="286" class="value" fill="#12813c">Most likely: x1.30</text>

  <text x="126" y="724" class="note">The support remains x1.10–x1.50 and the peak height remains 5.0.</text>

  <!-- Right panel: peak position -->
  <text x="954" y="168" class="panel-title">Peak position</text>
  <text x="954" y="196" class="subtitle">Moves linearly with Cooking</text>

  <line x1="1000" y1="270" x2="1000" y2="590" stroke="#748198" stroke-width="2"/>
  <line x1="1000" y1="590" x2="1308" y2="590" stroke="#748198" stroke-width="2"/>
  <path d="M1308 590 L1296 583 L1296 597 Z" fill="#748198"/>

  <line x1="1000" y1="590" x2="1300" y2="590" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="1000" y1="430" x2="1300" y2="430" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>
  <line x1="1000" y1="270" x2="1300" y2="270" stroke="#dbe2ec" stroke-width="1.5" stroke-dasharray="5 7"/>

  <text x="982" y="596" class="tick" text-anchor="end">1.10</text>
  <text x="982" y="436" class="tick" text-anchor="end">1.20</text>
  <text x="982" y="276" class="tick" text-anchor="end">1.30</text>
  <text x="946" y="430" class="label" transform="rotate(-90 946 430)" text-anchor="middle">Most likely multiplier</text>

  <line x1="1000" y1="590" x2="1300" y2="270" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="1000" cy="590" r="8" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1150" cy="430" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1300" cy="270" r="8" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>

  <g class="tick" text-anchor="middle">
    <line x1="1000" y1="590" x2="1000" y2="600" stroke="#748198" stroke-width="2"/>
    <text x="1000" y="625">0</text>
    <line x1="1150" y1="590" x2="1150" y2="600" stroke="#748198" stroke-width="2"/>
    <text x="1150" y="625">50</text>
    <line x1="1300" y1="590" x2="1300" y2="600" stroke="#748198" stroke-width="2"/>
    <text x="1300" y="625">100</text>
  </g>
  <text x="1300" y="655" class="label" text-anchor="end">Cooking level</text>

  <rect x="954" y="680" width="364" height="56" rx="10" fill="#f1f5f9" stroke="#dbe2ec"/>
  <text x="1136" y="704" class="note" text-anchor="middle">mode = 1.10 + (1.30 − 1.10)</text>
  <text x="1136" y="726" class="note" text-anchor="middle">× Cooking / 100</text>
</svg>
